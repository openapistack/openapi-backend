name: CI
on:
  push:
    branches: ["examples"]
  pull_request:
    branches: ["examples"]

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project_dir:
          - examples/express
          - examples/express-apikey-auth
          - examples/express-jwt-auth
          - examples/express-ts-mock
          - examples/express-typescript
          - examples/fastify
          - examples/hapi-typescript
          - examples/koa
          - examples/serverless-framework
          - examples/aws-sam
          - examples/aws-cdk
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/checkout@v5
        with:
          path: examples
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - uses: aws-actions/setup-sam@v2
        if: matrix.project_dir == 'examples/aws-sam' || matrix.project_dir == 'examples/aws-cdk'
      - run: npm ci && npm run build
      - run: npm ci
        working-directory: ${{ matrix.project_dir }}
      - run: npm link ../../
        if: matrix.project_dir != 'examples/aws-sam'
        working-directory: ${{ matrix.project_dir }}
      - run: npm test
        working-directory: ${{ matrix.project_dir }}
