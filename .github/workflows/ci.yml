name: CI
on:
  push:
    branches: ["main"]
    tags: ["*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project_dir:
          - .
          - examples/express
          - examples/express-apikey-auth
          - examples/express-jwt-auth
          - examples/express-ts-mock
          - examples/express-typescript
          - examples/fastify
          - examples/hapi-typescript
          - examples/koa
          - examples/serverless-framework
          - examples/aws-sam
          - examples/aws-cdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: examples
          path: examples
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.8"
      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        if: matrix.project_dir == 'examples/aws-sam' || matrix.project_dir == 'examples/aws-cdk'
      - run: npm ci && npm run build
      - run: npm ci
        working-directory: ${{ matrix.project_dir }}
      - run: npm link ../../
        if: matrix.project_dir != '.' && matrix.project_dir != 'examples/aws-sam'
        working-directory: ${{ matrix.project_dir }}
      - run: npm run lint
        if: matrix.project_dir == '.'
        working-directory: ${{ matrix.project_dir }}
      - run: npm test
        working-directory: ${{ matrix.project_dir }}

  publish:
    name: Publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - test
    # Only this job can mint an OIDC token for npm trusted publishing. The test job installs
    # third-party packages for every example project and must not be able to publish.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      # No dependency install scripts while an OIDC token is available. prepublishOnly still builds.
      - run: npm ci --ignore-scripts
      - run: npm publish

  release:
    name: Release
    needs:
      - publish
    # GitHub release, CHANGELOG.md entry and SBOM assets. Each job in release.yml narrows these permissions further.
    permissions:
      contents: write
      pull-requests: read
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
