name: SBOM and third party notices
on:
  push:
    branches: ["main"]
    paths:
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate SBOM and notices
    runs-on: ubuntu-latest
    # Runs third-party code (dependencies, npx tools) without a write token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: npm run sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: |
            sbom/
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 1

  commit:
    name: Commit changes
    needs: generate
    runs-on: ubuntu-latest
    # Holds the write token and runs nothing but git on the generated files.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The artifact comes from a job that ran third-party code, so it is never extracted over the checkout: a file
      # landing in .git/ (config, hooks) would run in this job, which holds the write token.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom-artifact
      - name: Copy the generated files into the checkout
        run: |
          src="$(realpath -e "$RUNNER_TEMP/sbom-artifact")"
          for file in \
            sbom/openapi-backend.cdx.json \
            sbom/openapi-backend.full.cdx.json \
            sbom/licenses-production.csv \
            sbom/licenses-all.csv \
            THIRD_PARTY_NOTICES.md
          do
            # Only these five files, by name, and only regular files that really are inside the artifact
            # (no symlinks, in the file or in its directory).
            if [ ! -f "$src/$file" ] || [ "$(realpath -e "$src/$file")" != "$src/$file" ]; then
              echo "::error::$file is missing from the SBOM artifact or is not a regular file"
              exit 1
            fi
            cp -- "$src/$file" "$file"
          done
      - name: Commit changes
        run: |
          git add sbom THIRD_PARTY_NOTICES.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update SBOM and third party notices"
          git push
