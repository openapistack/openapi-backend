name: SBOM and third party notices
on:
  push:
    branches: ["main"]
    paths:
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate SBOM and notices
    runs-on: ubuntu-latest
    # Runs third-party code (dependencies, npx tools) without a write token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: npm run sbom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: |
            sbom/
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 1

  commit:
    name: Commit changes
    needs: generate
    runs-on: ubuntu-latest
    # Holds the write token and runs nothing but git on the generated files.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
      - name: Commit changes
        run: |
          git add sbom THIRD_PARTY_NOTICES.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update SBOM and third party notices"
          git push
